# Unit matrix (3.11-3.14) plus the root network-namespace integration job.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test-bed tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            iproute2 nftables procps iputils-ping openssl
      - name: Preflight
        run: sudo env "PATH=$PATH" "$(command -v python)" -m tests.ci.preflight
      - run: pip install -e '.[dev]'
      - name: Run the network-namespace suite
        run: sudo env "PATH=$PATH" "$(command -v python)" -m pytest -m integration -o addopts="" -q
